[package]
name = "ironbound"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "site"
path = "src/bin/site.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.127"
wasm-bindgen-futures = "=0.4.77"
js-sys = "=0.3.104"
web-sys = { version = "=0.3.104", features = ["Location", "History", "Window", "Document", "Element", "DomRect", "HtmlElement", "HtmlInputElement", "HtmlSelectElement", "HtmlTextAreaElement", "HtmlAnchorElement", "Event", "EventTarget", "MouseEvent", "Node", "NodeList", "Storage", "Navigator", "Clipboard", "Request", "RequestInit", "RequestMode", "RequestRedirect", "Response", "Headers", "Blob", "BlobPropertyBag", "Url", "File", "FileList", "console"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = "debuginfo"

[profile.dev]
incremental = false

# Separate package artifacts for verification while another checkout is building.
# Reuse one Cargo target root; avoid racing its default dev/release library outputs.
[profile.verify-dev]
inherits = "dev"

[profile.verify-release]
inherits = "release"

# Keep simulation package outputs separate from other active verification builds.
[profile.simulation-dev]
inherits = "dev"

[profile.simulation-release]
inherits = "release"

[profile.calibration-dev]
inherits = "dev"

[profile.calibration-release]
inherits = "release"

# Shared target root, separate package artifacts from concurrent checkouts.
[profile.monster-dev]
inherits = "dev"
debug = 0

[profile.monster-release]
inherits = "release"

[profile.raid-dev]
inherits = "dev"
debug = 0

[profile.raid-release]
inherits = "release"
