[package]
name = "ironbound"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "site"
path = "src/bin/site.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.127"
wasm-bindgen-futures = "=0.4.77"
js-sys = "=0.3.104"
web-sys = { version = "=0.3.104", features = ["Location", "History", "Window", "Document", "Element", "HtmlElement", "HtmlInputElement", "HtmlSelectElement", "HtmlTextAreaElement", "HtmlAnchorElement", "Event", "EventTarget", "MouseEvent", "Node", "NodeList", "Storage", "Navigator", "Clipboard", "Request", "RequestInit", "RequestMode", "RequestRedirect", "Response", "Headers", "Blob", "BlobPropertyBag", "Url", "File", "FileList", "console"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = "debuginfo"

[profile.dev]
incremental = false
